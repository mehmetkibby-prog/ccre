# /etc/nginx/sites-available/coreoflife  (Cloudflare arkasında; SSL modu: Full (strict))
# Sertifika: Cloudflare → SSL/TLS → Origin Server → Create Certificate (15 yıl).
#   /etc/ssl/cloudflare/origin.pem  ← "Origin Certificate" metni
#   /etc/ssl/cloudflare/origin.key  ← "Private Key" metni (chmod 600)
# Gerçek oyuncu IP'si: deploy/cloudflare-realip.sh → /etc/nginx/conf.d/cloudflare-realip.conf
server {
    listen 80;
    listen [::]:80;
    server_name ALAN_ADIN.com www.ALAN_ADIN.com;
    return 301 https://ALAN_ADIN.com$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ALAN_ADIN.com www.ALAN_ADIN.com;
    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    client_max_body_size 64k;

    # www → çıplak alan adı
    if ($host = www.ALAN_ADIN.com) { return 301 https://ALAN_ADIN.com$request_uri; }

    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;   # real_ip modülü sayesinde oyuncunun gerçek IP'si
        proxy_read_timeout 3600s;
        proxy_buffering off;
        tcp_nodelay on;
    }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        gzip on; gzip_types text/css application/javascript application/json;
    }
}
