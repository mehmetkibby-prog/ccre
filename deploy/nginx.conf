# /etc/nginx/sites-available/coreoflife
server {
    listen 80;
    server_name ALAN_ADIN.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name ALAN_ADIN.com;
    ssl_certificate     /etc/letsencrypt/live/ALAN_ADIN.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ALAN_ADIN.com/privkey.pem;
    client_max_body_size 64k;

    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        tcp_nodelay on;
    }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        gzip on; gzip_types text/css application/javascript application/json;
    }
}
