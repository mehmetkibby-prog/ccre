# Existing HTTPS server{} block: review before production installation.
# Keep the forum service listening only on 127.0.0.1.
# FORUM_ORIGIN=https://coreoflife.net FORUM_TRUST_PROXY=1
location = /forum {
    return 308 /forum/;
}
location ^~ /forum/ {
    client_max_body_size 24k;
    proxy_pass http://127.0.0.1:8114;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 20s;
}
